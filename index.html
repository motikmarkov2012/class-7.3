<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Школьный Портал 7 «3»</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--surface);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 90vh;
            max-height: 850px;
        }

        /* Экраны */
        .screen {
            display: none;
            flex-direction: column;
            height: 100%;
            padding: 24px;
            overflow-y: auto;
        }

        .screen.active {
            display: flex;
        }

        /* Авторизация */
        .auth-screen {
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .auth-screen h1 {
            margin-bottom: 8px;
            color: var(--primary);
        }

        .auth-screen p {
            color: var(--text-secondary);
            margin-bottom: 24px;
            font-size: 14px;
        }

        .input-group {
            width: 100%;
            margin-bottom: 16px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
        }

        button {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--primary-hover);
        }

        /* Шапка портала */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 16px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #e0e7ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: var(--primary);
            overflow: hidden;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user-details h3 {
            font-size: 14px;
        }

        .user-details span {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .logout-btn {
            background: transparent;
            color: var(--danger);
            width: auto;
            padding: 6px 12px;
            font-size: 13px;
        }

        .logout-btn:hover {
            background: #fee2e2;
        }

        /* Лента и Истории */
        .stories-container {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 16px;
        }

        .story-card {
            min-width: 80px;
            height: 120px;
            border-radius: 10px;
            background: #e2e8f0;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 8px;
            position: relative;
            cursor: pointer;
            background-size: cover;
            background-position: center;
            color: white;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        .story-author-badge {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            background: rgba(0,0,0,0.5);
            padding: 2px 6px;
            border-radius: 10px;
            width: fit-content;
            margin-bottom: 2px;
        }

        .story-author-badge img {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            object-fit: cover;
        }

        .delete-story-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            background: rgba(239, 68, 68, 0.8);
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .feed {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .post {
            background: white;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
        }

        .post-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .post-content {
            font-size: 14px;
            margin-bottom: 8px;
        }

        /* Навигация внизу */
        .nav-tabs {
            display: flex;
            border-top: 1px solid var(--border);
            padding-top: 12px;
            margin-top: auto;
        }

        .nav-tab {
            flex: 1;
            text-align: center;
            background: none;
            color: var(--text-secondary);
            font-size: 13px;
            padding: 6px;
            cursor: pointer;
        }

        .nav-tab.active {
            color: var(--primary);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Экран авторизации -->
        <div id="authScreen" class="screen auth-screen active">
            <h1>Школьный Портал</h1>
<p>Введите пароль для входа (учитель, староста, ученик или разработчик)</p>
            <div class="input-group">
                <label for="usernameInput">Ваше имя / Логин</label>
                <input type="text" id="usernameInput" placeholder="Например: Иван или teacher73">
            </div>
            <div class="input-group">
                <label for="passwordInput">Пароль</label>
                <input type="password" id="passwordInput" placeholder="Введите пароль">
            </div>
            <button onclick="login()">Войти</button>
        </div>

        <!-- Основной экран портала -->
        <div id="portalScreen" class="screen">
            <div class="header">
                <div class="user-info">
                    <div class="avatar" id="headerAvatar">У</div>
                    <div class="user-details">
                        <h3 id="headerName">Имя</h3>
                        <span id="headerRole">Ученик</span>
                    </div>
                </div>
                <button class="logout-btn" onclick="logout()">Выйти</button>
            </div>

            <!-- Лента / Истории -->
            <div id="mainContent" style="flex:1; display:flex; flex-direction:column; overflow:hidden;">
                <!-- Блок историй -->
                <div style="margin-bottom: 8px; display:flex; justify-content: space-between; align-items: center;">
                    <h4 style="font-size: 14px; color: var(--text-secondary);">Истории</h4>
                    <button onclick="addStory()" style="width: auto; padding: 4px 8px; font-size: 12px;">+ История</button>
                </div>
                <div class="stories-container" id="storiesContainer">
                    <!-- Истории добавляются динамически -->
                </div>

                <hr style="border:0; border-top:1px solid var(--border); margin: 8px 0;">

                <!-- Лента публикаций -->
                <div style="margin-bottom: 8px; display:flex; justify-content: space-between; align-items: center;">
                    <h4 style="font-size: 14px; color: var(--text-secondary);">Лента класса</h4>
                    <button onclick="addPost()" style="width: auto; padding: 4px 8px; font-size: 12px;">+ Пост</button>
                </div>
                <div class="feed" id="feedContainer">
                    <!-- Посты -->
                </div>
            </div>

            <!-- Вкладки навигации -->
            <div class="nav-tabs">
                <button class="nav-tab active" onclick="switchTab('feed')">Лента</button>
                <button class="nav-tab" onclick="switchTab('chat')">Чат</button>
                <button class="nav-tab" onclick="switchTab('profile')">Профиль</button>
            </div>
        </div>
    </div>

    <script>
        // Данные текущего пользователя
        let currentUser = {
            name: '',
            role: 'Ученик',
            password: '',
            avatar: ''
        };

        // База историй (с аватаркой автора и поддержкой удаления)
        let stories = [
            { id: 1, author: 'Лиза', avatar: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100', text: 'Экскурсия в музей', bg: '#4f46e5' },
            { id: 2, author: 'Матвей', avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100', text: 'Робототехника', bg: '#0ea5e9' }
        ];

        let posts = [
            { author: 'Классный руководитель', role: 'Учитель', text: 'Завтра сбор у школы в 9:00!' }
        ];

        function login() {
            const userVal = document.getElementById('usernameInput').value.trim();
            const passVal = document.getElementById('passwordInput').value.trim();

            if (!userVal || !passVal) {
                alert('Введите имя и пароль!');
                return;
            }

            // Проверка паролей согласно условиям
            if (passVal === 'teacher73') {
                currentUser.role = 'Классный руководитель';
            } else if (passVal === 'starosta73') {
                currentUser.role = 'Староста';
            } else if (passVal === '2134') {
                currentUser.role = 'Разработчик (Матвей Марков)';
            } else if (passVal === '1234') {
                currentUser.role = 'Ученик';
            } else {
                alert('Неверный пароль! (Подсказки: teacher73, starosta73, 1234, 2134)');
                return;
            }

            currentUser.name = userVal;
            currentUser.password = passVal;
            currentUser.avatar = `https://api.dicebear.com/7.x/avataaars/svg?seed=${encodeURIComponent(userVal)}`;

            document.getElementById('headerName').innerText = currentUser.name;
            document.getElementById('headerRole').innerText = currentUser.role;
            document.getElementById('headerAvatar').innerHTML = `<img src="${currentUser.avatar}" alt="avatar">`;

            document.getElementById('authScreen').classList.remove('active');
            document.getElementById('portalScreen').classList.add('active');
            renderStories();
            renderPosts();
        }

        function logout() {
            document.getElementById('portalScreen').classList.remove('active');
            document.getElementById('authScreen').classList.add('active');
            document.getElementById('passwordInput').value = '';
        }

        function renderStories() {
            const container = document.getElementById('storiesContainer');
            container.innerHTML = '';

            stories.forEach(story => {
                const card = document.createElement('div');
                card.className = 'story-card';
                card.style.backgroundColor = story.bg || '#4f46e5';
                
                // Кнопка удаления доступна автору или учителю/разработчику
                let deleteBtnHtml = '';
                if (story.author === currentUser.name || currentUser.role.includes('Учитель') || currentUser.role.includes('Разработчик')) {
                    deleteBtnHtml = `<button class="delete-story-btn" onclick="deleteStory(${story.id}); event.stopPropagation();">×</button>`;
                }

                card.innerHTML = `
                    ${deleteBtnHtml}
                    <div class="story-author-badge">
                        <img src="${story.avatar}" alt="">
                        <span>${story.author}</span>
                    </div>
                    <span style="font-size: 11px;">${story.text}</span>
                `;
                container.appendChild(card);
            });
        }

        function addStory() {
            const text = prompt('Введите текст истории:');
            if (text) {
                stories.push({
                    id: Date.now(),
                    author: currentUser.name,
                    avatar: currentUser.avatar,
                    text: text,
                    bg: '#' + Math.floor(Math.random()*16777215).toString(16)
                });
                renderStories();
            }
        }

        function deleteStory(id) {
            stories = stories.filter(s => s.id !== id);
            renderStories();
        }

        function renderPosts() {
            const container = document.getElementById('feedContainer');
            container.innerHTML = '';
            posts.forEach(post => {
                const div = document.createElement('div');
                div.className = 'post';
                div.innerHTML = `
                    <div class="post-header">
                        <strong>${post.author}</strong> <span style="font-size:11px; color:var(--text-secondary);">(${post.role})</span>
                    </div>
                    <div class="post-content">${post.text}</div>
                `;
                container.appendChild(div);
            });
        }

        function addPost() {
            const text = prompt('Введите текст публикации:');
            if (text) {
                posts.unshift({
                    author: currentUser.name,
                    role: currentUser.role,
                    text: text
                });
                renderPosts();
            }
        }

        function switchTab(tabName) {
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            if (tabName === 'chat') {
                alert('Раздел чата (использует данные из чата класса)');
            }
        }
    </script>
</body>
</html>
